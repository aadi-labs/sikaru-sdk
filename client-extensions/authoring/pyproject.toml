[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sikaru-authoring"
version = "0.1.0"
description = "Customer source packaging companion for the generated Sikaru SDK"
requires-python = ">=3.10"
license = "Apache-2.0"
readme = "README.md"

[tool.hatch.build.targets.wheel]
packages = ["src/sikaru_authoring"]
