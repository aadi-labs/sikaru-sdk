[package]
name = "sikaru"
version = "0.2.3"
edition = "2021"
description = "Official Rust SDK for the Sikaru API."
license = "MIT"
repository = "https://github.com/aadi-labs/sikaru-sdk"
documentation = "https://docs.rs/sikaru"

[lib]
doctest = false

[dependencies]
bytes = "1.0"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
pin-project = { version = "1.1", optional = true }
reqwest = { version = "0.12", features = ["json", "stream", "gzip", "rustls-tls"], default-features = false }
reqwest-sse = { version = "0.1", optional = true }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
tokio = { version = "1.0", features = ["full"] }

[dev-dependencies]
base64 = "0.22"
ctor = "0.2"
tokio-test = "0.4"

[features]
default = ["sse"]
sse = ["reqwest-sse", "pin-project"]
