name: Verify SDKs

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sdk-verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  language:
    name: ${{ matrix.language }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        language: [python, typescript]
    defaults:
      run:
        working-directory: ${{ matrix.language }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        if: matrix.language == 'typescript'
        with:
          node-version: '22'
      - uses: pnpm/action-setup@v4
        if: matrix.language == 'typescript'
        with:
          package_json_file: typescript/package.json
      - name: Build Python wheel and source distribution
        if: matrix.language == 'python'
        run: |
          python -m pip install 'build>=1,<2'
          python -m build
          python -m pip install .
          python -c 'from sikaru_api import SikaruApi, AsyncSikaruApi'
          python -m pip install ../client-extensions/authoring
          python -c 'from sikaru_authoring import compile_directory'
      - name: Build TypeScript and run unit tests
        if: matrix.language == 'typescript'
        run: |
          pnpm install --frozen-lockfile --ignore-scripts
          npm run build:cjs
          npm run build:esm
          node_modules/.bin/vitest run --project unit
      - name: Python compute lifecycle wire contract
        if: matrix.language == 'python'
        run: python ../client-extensions/compute-contracts/wire.py python ../client-extensions/compute-contracts/python_contract.py
      - name: TypeScript compute lifecycle wire contract
        if: matrix.language == 'typescript'
        run: |
          node_modules/.bin/tsc --project ../client-extensions/compute-contracts/tsconfig.json
          python ../client-extensions/compute-contracts/wire.py node ../client-extensions/compute-contracts/typescript_contract.js
